# Inbound firewall (ufw) for central. deploy/firewall.sh makes ufw match this file plus
# firewall-apps.conf on every deploy: anything not listed here is closed.
# One rule per line, written the way `ufw show added` prints it, minus the leading "ufw".
# App ports reached through Caddy are generated from apps.yaml into firewall-apps.conf; don't list them here.
# Docker-published ports (Caddy's 80/443) bypass ufw anyway; they're listed so this file is the full picture.
allow from 192.168.4.0/22 to any port 22 proto tcp comment 'ssh, LAN only'
allow 80/tcp comment 'caddy http'
allow 443/tcp comment 'caddy https'
allow 443/udp comment 'caddy http3'
allow 32400/tcp comment 'plex, incl. remote streaming'
allow from 192.168.4.0/22 to any port 32410:32414 proto udp comment 'plex LAN discovery'
allow from 192.168.4.0/22 to any port 1900:1901 proto udp comment 'plex DLNA'
allow from 192.168.4.0/22 to any port 5353 proto udp comment 'mdns'
allow from 192.168.4.4 comment 'nas: nfs v3 lock callbacks'
